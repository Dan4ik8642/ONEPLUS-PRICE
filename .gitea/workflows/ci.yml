name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run build
      - run: cp .env.example .env
      - run: docker compose --env-file .env -f compose.yml config --quiet
      - run: docker compose --env-file .env -f compose.yml -f compose.postgres.yml config --quiet
      - run: docker build -t oneplus-price:${{ gitea.sha }} .
