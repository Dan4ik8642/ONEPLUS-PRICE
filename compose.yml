name: ${COMPOSE_PROJECT_NAME:-oneplus-price}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik-public}
      - traefik.http.routers.oneplus-price.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.oneplus-price.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.oneplus-price.tls=true
      - traefik.http.routers.oneplus-price.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.oneplus-price.loadbalancer.server.port=3000

networks:
  traefik-public:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-public}
